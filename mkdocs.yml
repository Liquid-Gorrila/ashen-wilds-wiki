site_name: Ashen Wilds
site_description: The official player guide for Ashen Wilds, an isometric desert survival and automation game.
site_url: https://liquid-gorrila.github.io/ashen-wilds-wiki/
repo_url: https://github.com/Liquid-Gorrila/ashen-wilds-wiki
repo_name: ashen-wilds-wiki
edit_uri: edit/main/docs/
copyright: Art by Penusbmic · Built with Godot Engine · <a href="/ashen-wilds-wiki/reference/credits/">Credits</a>

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: dusk
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to daylight
    - media: "(prefers-color-scheme: light)"
      scheme: sand
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dusk
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Start here:
      - start/index.md
      - First days: start/first-days.md
      - Objectives: start/objectives.md
      - Tips and strategy: start/tips.md
  - The world:
      - world/index.md
      - Day and night: world/day-night.md
      - Sandstorms: world/sandstorms.md
      - Caves: world/caves.md
      - Speed Racer: world/speed-racer.md
      - Merchants and loot: world/merchants.md
      - Relics and guardians: world/relics.md
  - Survival:
      - survival/index.md
      - Food: survival/food.md
      - Buffs: survival/buffs.md
  - Combat:
      - combat/index.md
      - Raiders and wildlife: combat/enemies.md
      - Base raids: combat/base-raids.md
      - The Dust Jumper: combat/boss.md
      - Companion drone: combat/companion.md
      - Relic boons: combat/boons.md
  - Building:
      - building/index.md
      - Build costs: building/costs.md
      - Production: building/production.md
      - Power: building/power.md
      - Logistics: building/logistics.md
      - Defenses and upgrades: building/defense.md
  - Reference:
      - reference/index.md
      - Controls: reference/controls.md
      - Interface and settings: reference/interface.md
      - Items: reference/items.md
      - Saving: reference/saving.md
      - FAQ: reference/faq.md
      - Credits: reference/credits.md
